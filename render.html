<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quake Town — renderer test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; left: 8px; top: 8px; font: 12px/1.35 ui-monospace, Menlo, monospace; color: #e8e2d0;
         background: rgba(0,0,0,.55); padding: 6px 9px; border-radius: 4px; white-space: pre; pointer-events: none; }
  #help { position: fixed; right: 8px; bottom: 8px; font: 11px/1.4 ui-monospace, monospace; color: #b8b2a0;
          background: rgba(0,0,0,.45); padding: 6px 9px; border-radius: 4px; white-space: pre; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">loading…</div>
<div id="help">click: mouse look · WASD/QE fly · shift fast · 1 classic · 2 modern · F flashblend · B bloom
R rocket · G gunshot · L lightning · T teleport · M next map · P drawflat · H hide</div>
<script type="module" src="/src/render/demo/main.ts"></script>
</body>
</html>
